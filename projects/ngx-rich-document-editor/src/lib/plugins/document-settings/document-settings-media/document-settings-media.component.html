<div class="references-container">
  @for (ref of mediaService.mediaItems(); track $index) {
    <div class="reference-item">
      <button class="rde-button">
        <rde-svg-icon [name]="ref.icon" [primary]="true" />

        <div class="reference-content">
          <div class="reference-header">
            <h4 class="reference-title">{{ ref.title }}</h4>
          </div>

          <div class="reference-metadata">
            <a target="_blank" class="reference-url" [href]="ref.url">{{ ref.url }}</a>
          </div>
        </div>
      </button>
      <button class="remove-button" (click)="removeLink(ref.url)">
        <rde-svg-icon name="delete" />
      </button>
    </div>
  } @empty {
    <div class="no-references">No files or links added.</div>
  }
</div>
