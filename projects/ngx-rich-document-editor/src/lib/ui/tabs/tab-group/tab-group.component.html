<div class="rde-tab-list" role="tablist">
  @for (tab of tabs(); track $index) {
    <div class="rde-tab-list__element"
         role="tab"
         tabindex="0"
         [class.rde-tab-list__element--active]="selectedIndex() === $index"
         [attr.id]="'tab-' + tab.id()"
         [attr.aria-selected]="selectedIndex() === $index"
         [attr.aria-controls]="'panel-' + tab.id()" (click)="selectTab($index)" (keyup)="selectTab($index)">
      {{ tab.label() }}
    </div>
  }
</div>

<div class="rde-tab-content">
  @for (tab of tabs(); track $index) {
    @let content = tab.content();
    <div role="tabpanel"
         [attr.id]="'panel-' + tab.id()"
         [attr.aria-labelledby]="'tab-' + tab.id()"
         [hidden]="selectedIndex() !== $index">
      @if (content) {
        <ng-container [ngTemplateOutlet]="content"/>
      }
    </div>
  }
</div>
