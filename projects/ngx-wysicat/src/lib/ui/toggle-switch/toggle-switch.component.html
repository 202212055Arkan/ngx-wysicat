<label class="toggle-container">
  <input type="checkbox"
         class="toggle-input"
         id="toggle"
         [checked]="enabled()"
         (change)="toggle()">
  <span class="toggle-slider">
        <span class="toggle-knob"
          [class.toggle-knob-active]="enabled()"
        ></span>
      </span>
</label>
