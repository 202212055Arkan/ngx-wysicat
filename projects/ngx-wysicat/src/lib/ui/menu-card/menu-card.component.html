<div #menuContainer class="menu-sections">
  @for (category of items(); track $index) {
    <div class="section">
      <div class="list-container">
        @for (item of category.items; track item.name) {
          <button class="list-item"
                  [class.list-item--highlighted]="item.name === highlightedItem().name"
                  (click)="selectItem(item)">
            <ng-container
              *ngTemplateOutlet="iconType() === 'emoji' ? emojiItem : normalItem; context: { $implicit: item }"/>
          </button>
        }
      </div>
    </div>
  } @empty {
    <div class="empty">No elements found.</div>
  }
</div>

<ng-template #emojiItem let-item>
  <div style="font-size: 20px">{{ item.iconLabel }}</div>
  :{{ item.name }}:
</ng-template>

<ng-template #normalItem let-item>
  <nw-svg-icon [name]="item.iconLabel" [primary]="true"/>
  <span>{{ item.name }}</span>
</ng-template>
