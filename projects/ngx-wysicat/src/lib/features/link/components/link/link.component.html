<div class="menu-content" tabindex="0" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <div class="header">Insert a link</div>
    <div class="form-group">
        <label for="linkText">Text</label>
        <input [(ngModel)]="linkText" id="linkText" placeholder="Text to display">
    </div>
    <div class="form-group">
        <label for="url">Link</label>
        <input [(ngModel)]="url" id="url" placeholder="https://example.com" (blur)="validateUrl()">
        @if (urlError()) {
            <div class="error-text">{{ urlError() }}</div>
        }
    </div>
    <div class="button-group">
        <button class="nw-button nw-button__primary" (click)="handleCancel()">Cancel</button>
        <button class="nw-button nw-button__secondary" (click)="handleSubmit()">Submit</button>
    </div>
</div>
